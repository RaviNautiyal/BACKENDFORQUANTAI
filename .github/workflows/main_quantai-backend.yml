# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - quantai-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Check target app availability
        id: app-availability
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_15CBF3A6185D4E9D95F8320C36F9F844 }}
        run: |
          APP_URL=$(printf '%s' "$PUBLISH_PROFILE" | sed -n 's/.*destinationAppUrl="\([^"]*\)".*/\1/p' | head -n 1)

          if [[ "$APP_URL" =~ ^http:// ]]; then
            APP_URL="https://${APP_URL#http://}"
          elif [[ ! "$APP_URL" =~ ^https:// ]]; then
            APP_URL="https://$APP_URL"
          fi

          if [ -z "$APP_URL" ]; then
            echo "::warning::Could not extract App Service URL from publish profile, proceeding with deployment."
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$APP_URL" =~ ^https://[A-Za-z0-9._-]+(:[0-9]+)?(/[^[:space:]]*)?$ ]]; then
            echo "::warning::Invalid App Service URL format extracted from publish profile, proceeding with deployment."
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          HTTP_STATUS=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 --url "$APP_URL")
          CURL_EXIT_CODE=$?
          set -e
          if [ "$CURL_EXIT_CODE" -ne 0 ] || [ -z "$HTTP_STATUS" ]; then
            HTTP_STATUS="000"
            echo "::warning::App availability check request failed (curl exit code $CURL_EXIT_CODE), proceeding with deployment."
          fi
          echo "App availability check returned HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "403" ]; then
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HTTP_STATUS" =~ ^5[0-9]{2}$ ]]; then
            echo "::warning::App availability check reached the app but got server error HTTP $HTTP_STATUS, proceeding with deployment."
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 'Deploy to Azure Web App'
        if: steps.app-availability.outputs.skip_deploy != 'true'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'quantai-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_15CBF3A6185D4E9D95F8320C36F9F844 }}

      - name: Deployment skipped because app is disabled
        if: steps.app-availability.outputs.skip_deploy == 'true'
        run: echo "::warning::Skipping deployment because the target Azure App Service is disabled (HTTP 403). Re-enable the app service and rerun this workflow."